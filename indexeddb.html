<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SyncBridge Local-first</title>
<style>:root{font-family:system-ui,sans-serif;color:#e7eef8;background:#0f1726}body{max-width:900px;margin:0 auto;padding:32px 18px}h1{margin:0 0 6px;font-size:clamp(30px,6vw,52px)}p{color:#aebdd1}.bar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:22px 0}.pill{background:#19314a;padding:8px 12px;border-radius:999px}.ok{color:#74e1b0}.warn{color:#ffd27d}.card{background:#172337;border:1px solid #2c405d;border-radius:16px;padding:18px;margin-top:16px}form{display:grid;grid-template-columns:1fr 1fr auto;gap:10px}input,button{font:inherit;border-radius:10px;padding:12px;border:1px solid #3a5273}input{background:#0c1422;color:white}button{background:#65d7aa;color:#082318;border:0;font-weight:700;cursor:pointer}.task{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid #2b3b53}.muted{color:#91a4bb;font-size:13px}.hidden{display:none}@media(max-width:650px){form{grid-template-columns:1fr}.task{gap:10px;flex-direction:column}}</style>
</head>
<body>
<h1>SyncBridge</h1><p>تطبيق مهام يعمل محليًا أولًا باستخدام IndexedDB</p>
<section class="card" id="auth"><h2 id="auth-title">تسجيل الدخول</h2><form id="auth-form"><input id="email" type="email" placeholder="البريد الإلكتروني" required><input id="password" type="password" placeholder="كلمة المرور، 8 أحرف على الأقل" minlength="8" required><button id="auth-button">دخول</button></form><p id="auth-message" class="muted">حساب جديد؟ <button type="button" id="mode-button">إنشاء حساب</button></p></section>
<main id="workspace" class="hidden"><div class="bar"><span class="pill" id="connection">جار الاتصال...</span><span class="pill">في الانتظار: <b id="pending">0</b></span><span class="pill">آخر تسلسل: <b id="cursor">0</b></span><button id="logout">خروج</button></div><section class="card"><h2>إضافة مهمة</h2><form id="task-form"><input id="title" placeholder="مثال: مراجعة التقرير" required><input id="owner" placeholder="المسؤول" required><button>حفظ محليًا</button></form><p class="muted">يتم الحفظ فورًا حتى عند انقطاع الإنترنت، ثم الإرسال تلقائيًا.</p></section><section class="card"><h2>المهام</h2><div id="tasks"></div></section></main>
<script>
const STORE='tasks',OUTBOX='outbox',META='meta';let db,cursor=0,syncing=false,token=localStorage.getItem('syncbridge_token'),accountId=localStorage.getItem('syncbridge_user_id');const authBox=document.getElementById('auth'),workspaceBox=document.getElementById('workspace'),authForm=document.getElementById('auth-form'),authButton=document.getElementById('auth-button'),authTitle=document.getElementById('auth-title'),authMessage=document.getElementById('auth-message'),modeButton=document.getElementById('mode-button'),emailInput=document.getElementById('email'),passwordInput=document.getElementById('password'),connectionLabel=document.getElementById('connection'),pendingLabel=document.getElementById('pending'),cursorLabel=document.getElementById('cursor'),tasksBox=document.getElementById('tasks'),taskForm=document.getElementById('task-form'),titleInput=document.getElementById('title'),ownerInput=document.getElementById('owner');
const openDb=()=>new Promise((resolve,reject)=>{if(!accountId)return reject(Error('لم يتم تحديد الحساب'));const r=indexedDB.open('syncbridge-local-'+accountId,1);r.onupgradeneeded=()=>{const d=r.result;d.createObjectStore(STORE,{keyPath:'id'});d.createObjectStore(OUTBOX,{keyPath:'event_id'});d.createObjectStore(META,{keyPath:'key'});};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)});
const tx=(s,m='readonly')=>db.transaction(s,m),all=s=>new Promise((res,rej)=>{const r=tx([s]).objectStore(s).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}),put=(s,v)=>new Promise((res,rej)=>{const r=tx([s],'readwrite').objectStore(s).put(v);r.onsuccess=res;r.onerror=()=>rej(r.error)}),del=(s,k)=>tx([s],'readwrite').objectStore(s).delete(k);
async function setCursor(n){cursor=n;await put(META,{key:'cursor',value:n});cursorLabel.textContent=n}
function esc(v){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
async function render(){const rows=await all(STORE),queue=await all(OUTBOX);pendingLabel.textContent=queue.length;tasksBox.innerHTML=rows.length?rows.map(t=>`<div class="task"><strong>${esc(t.title)}</strong><span class="muted">${esc(t.owner)} · ${new Date(t.updated_at*1000).toLocaleTimeString()}</span></div>`).join(''):'<p class="muted">لا توجد مهام بعد.</p>'}
async function addTask(title,owner){const id=crypto.randomUUID(),now=Date.now()/1000,data={id,title,owner,updated_at:now};await put(STORE,data);await put(OUTBOX,{event_id:crypto.randomUUID(),table:'tasks',operation:'upsert',key:{id},data});await render();sync()}
async function sync(){if(!token||syncing)return;syncing=true;try{for(const e of await all(OUTBOX)){const r=await fetch('/events',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(e)});if(r.status===401){logout();return}if(!r.ok)throw Error('send failed');await del(OUTBOX,e.event_id)}const r=await fetch('/changes?since='+cursor,{headers:{Authorization:'Bearer '+token}});if(!r.ok)throw Error('pull failed');for(const e of (await r.json()).changes){const q=tx([STORE]).objectStore(STORE).get(e.key.id);const local=await new Promise(res=>{q.onsuccess=()=>res(q.result)});if(!local||e.data.updated_at>=local.updated_at)await put(STORE,{...e.key,...e.data});await setCursor(e.sequence)}connectionLabel.textContent='متصل ومتزامن';connectionLabel.className='pill ok';await render()}catch(e){connectionLabel.textContent='غير متصل، الحفظ المحلي فعال';connectionLabel.className='pill warn';await render()}finally{syncing=false}}
function showWorkspace(){authBox.classList.add('hidden');workspaceBox.classList.remove('hidden');openDb().then(async opened=>{db=opened;const m=await new Promise(res=>{const q=tx([META]).objectStore(META).get('cursor');q.onsuccess=()=>res(q.result)});if(m){cursor=m.value;cursorLabel.textContent=cursor}await render();sync();setInterval(sync,2500)}).catch(error=>{authMessage.textContent='تعذر فتح التخزين المحلي: '+error.message;authBox.classList.remove('hidden');workspaceBox.classList.add('hidden')})}
function logout(){token=null;accountId=null;localStorage.removeItem('syncbridge_token');localStorage.removeItem('syncbridge_user_id');location.reload()}
let registerMode=false;modeButton.onclick=()=>{registerMode=!registerMode;authTitle.textContent=registerMode?'إنشاء حساب':'تسجيل الدخول';authButton.textContent=registerMode?'إنشاء حساب':'دخول';authMessage.textContent=registerMode?'أدخل بريدك وكلمة مرور من 8 أحرف على الأقل.':'حساب جديد؟';};authForm.onsubmit=async e=>{e.preventDefault();try{const path=registerMode?'/auth/register':'/auth/login',r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:emailInput.value,password:passwordInput.value})}),d=await r.json();if(!r.ok)throw Error(d.error);token=d.token;accountId=d.user_id;localStorage.setItem('syncbridge_token',token);localStorage.setItem('syncbridge_user_id',accountId);showWorkspace()}catch(x){authMessage.textContent=x.message}};
taskForm.onsubmit=async e=>{e.preventDefault();await addTask(titleInput.value,ownerInput.value);titleInput.value='';ownerInput.value=''};document.getElementById('logout').onclick=logout;if(token&&accountId)showWorkspace();else if(token&&!accountId)logout();
</script></body></html>
